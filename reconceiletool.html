<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮雲客棧 (Kloud Hotel) - 智能訂單數統計與單號比對系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen" x-data="masterApp()">
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">浮雲客棧 (Kloud Hotel) - 每日訂單統計與單號比對系統</h1>
                <p class="text-slate-400 text-sm mt-1">完美支援 Agoda、Ctrip、Expedia、易遊網、Booking.com 特殊格式！自動過濾無效代號並精準抓取客名與漏單。</p>
            </div>
            <div class="mt-4 sm:mt-0 bg-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold shadow">
                有效訂單總數：<span x-text="allParsedOrders.length"></span> 筆
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 flex flex-col gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-4">
                <h2 class="text-lg font-semibold text-slate-900 border-b pb-2">1. 貼上各平台 OTA 原始訂單</h2>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">各平台原始資料 (支援整批混貼)</label>
                    <textarea x-model="rawOtaInput" rows="12" placeholder="在此貼上各平台複製出來的整批訂單資料..." 
                        class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 font-mono text-xs"></textarea>
                </div>
                <button @click="parseOtaData" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition shadow text-sm">
                    解析 OTA 訂單資料
                </button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-4">
                <h2 class="text-lg font-semibold text-slate-900 border-b pb-2">2. 貼上 PMS 系統單號</h2>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">PMS 網路單號清單 (每行一個或空格分隔)</label>
                    <textarea x-model="pmsInput" rows="6" placeholder="在此貼上 PMS 內的網路單號..." 
                        class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 font-mono text-xs"></textarea>
                </div>
                <button @click="runReconciliation" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg transition shadow text-sm">
                    執行單號比對與檢查漏單
                </button>
            </div>
        </div>

        <div class="lg:col-span-2 flex flex-col gap-6">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                    <div class="text-xs text-slate-500 font-medium">總解析訂單</div>
                    <div class="text-2xl font-bold text-slate-900 mt-1" x-text="allParsedOrders.length">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                    <div class="text-xs text-slate-500 font-medium">PMS 已登記</div>
                    <div class="text-2xl font-bold text-emerald-600 mt-1" x-text="matchedCount">0</div>
                </div>
                <div class="bg-red-50 p-4 rounded-xl shadow-sm border border-red-200 text-center">
                    <div class="text-xs text-red-600 font-medium">⚠️ PMS 漏單</div>
                    <div class="text-2xl font-bold text-red-600 mt-1" x-text="missingOrders.length">0</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                    <div class="text-xs text-slate-500 font-medium">平台數統計</div>
                    <div class="text-2xl font-bold text-indigo-600 mt-1" x-text="platformStats">0</div>
                </div>
            </div>

            <!-- Feedback Message -->
            <template x-if="feedbackMsg">
                <div class="p-4 rounded-lg bg-blue-50 text-blue-800 border border-blue-200 font-medium text-sm flex justify-between items-center">
                    <span x-text="feedbackMsg"></span>
                    <button @click="feedbackMsg = ''" class="text-blue-500 hover:text-blue-700">&times;</button>
                </div>
            </template>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-sm font-semibold text-slate-900 mb-3 flex items-center gap-2">
                    <span>⚠️ 漏單清單 (存在於 OTA 但 PMS 未輸入)</span>
                </h3>
                <div class="bg-red-50 border border-red-200 rounded-lg p-4 max-h-48 overflow-y-auto">
                    <template x-if="missingOrders.length === 0 && allParsedOrders.length > 0">
                        <p class="text-xs text-emerald-700 font-medium">太棒了！目前比對結果無任何漏單。</p>
                    </template>
                    <template x-if="allParsedOrders.length === 0">
                        <p class="text-xs text-slate-500">請先在左側貼上並解析 OTA 訂單...</p>
                    </template>
                    <ul class="space-y-2">
                        <template x-for="order in missingOrders" :key="order.id">
                            <li class="text-xs font-mono text-red-700 flex justify-between items-center bg-white p-2 rounded border border-red-100 shadow-sm">
                                <div>
                                    <span class="font-bold text-indigo-600 mr-2" x-text="'[' + order.platform + ']'"></span>
                                    <span class="font-bold text-slate-900 mr-2" x-text="order.id"></span>
                                    <span class="text-slate-600 ml-1" x-text="order.name"></span>
                                </div>
                                <span class="text-slate-400" x-text="order.checkin"></span>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex-1">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-semibold text-slate-900">所有解析訂單明細與比對狀態</h3>
                    <input type="text" x-model="searchQuery" placeholder="搜尋單號或客名..." class="px-3 py-1.5 border rounded-lg text-xs w-48">
                </div>
                <div class="border rounded-lg max-h-96 overflow-y-auto text-xs">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-100 sticky top-0">
                            <tr>
                                <th class="p-2 border-b">平台</th>
                                <th class="p-2 border-b">訂單編號 (ID)</th>
                                <th class="p-2 border-b">住客姓名</th>
                                <th class="p-2 border-b">入住日期</th>
                                <th class="p-2 border-b">PMS 比對狀態</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="order in filteredOrders" :key="order.id">
                                <tr class="border-b hover:bg-slate-50">
                                    <td class="p-2 font-semibold text-slate-700" x-text="order.platform"></td>
                                    <td class="p-2 font-mono font-medium text-indigo-600" x-text="order.id"></td>
                                    <td class="p-2 font-medium text-slate-900" x-text="order.name"></td>
                                    <td class="p-2 text-slate-600" x-text="order.checkin"></td>
                                    <td class="p-2">
                                        <span class="px-2 py-0.5 rounded font-semibold text-[10px]"
                                            :class="order.inPms ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'"
                                            x-text="order.inPms ? '已登記 (Match)' : '未登記 (Missing)'"></span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const isEzDateRef = (id) => /^202\d{8}$/.test(id);

        function masterApp() {
            return {
                rawOtaInput: '',
                pmsInput: '',
                searchQuery: '',
                allParsedOrders: [],
                missingOrders: [],
                matchedCount: 0,
                platformStats: 0,
                feedbackMsg: '',
                
                parseOtaData() {
                    try {
                        let text = this.rawOtaInput;
                        if (!text.trim()) {
                            this.feedbackMsg = '請先在上方貼上 OTA 的原始資料再進行解析喔！';
                            return;
                        }

                        let orders = [];

                        // 1. Booking.com / Agoda YCS 完美切割法
                        const bookingRegex = /TWD\s*[\d,]+\s*TWD\s*[\d,]+?\s*(\d{10})(?!\d)/g;
                        const blocks = text.split(bookingRegex);
                        
                        for (let i = 1; i < blocks.length; i += 2) {
                            let id = blocks[i];
                            let rawBlock = blocks[i-1].trim();
                            
                            if (!isEzDateRef(id) && !orders.some(o => o.id === id)) {
                                let lines = rawBlock.split(/\r?\n/)
                                    .map(l => l.trim())
                                    .filter(l => l.length > 0 && !l.includes('住客姓名') && !l.includes('退房客房') && !l.includes('訂單編號') && !l.includes('佣金'));
                                
                                let name = 'Booking Guest';
                                for (let j = 0; j < lines.length; j++) {
                                    if (lines[j].includes('位成人') || lines[j].includes('年') || lines[j].includes('x ')) {
                                        if (j > 0) {
                                            name = lines[j-1];
                                        } else {
                                            name = lines[0]; 
                                        }
                                        break;
                                    }
                                }
                                
                                if (name === 'Booking Guest' && lines.length > 0) {
                                    name = lines[0];
                                }
                                
                                let checkin = '未知日期';
                                let dateMatch = rawBlock.match(/(\d{4}\s*年\s*\d+\s*月\s*\d+\s*日)/);
                                if (dateMatch) { checkin = dateMatch[1]; }
                                
                                orders.push({ platform: 'Booking/Agoda', id: id, name: name, checkin: checkin, inPms: false });
                            }
                        }

                        // 2. 一般 Agoda
                        const standardLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                        for (let i = 0; i < standardLines.length; i++) {
                            if (/^\d{8,12}$/.test(standardLines[i]) && !isEzDateRef(standardLines[i])) {
                                let id = standardLines[i];
                                if (!orders.some(o => o.id === id)) {
                                    let name = standardLines[i+2] || 'Agoda Guest';
                                    if (/^\d/.test(name) || name.includes('TWD')) name = 'Agoda Guest';
                                    
                                    let checkin = '未知日期';
                                    for (let j = i+3; j < Math.min(i+10, standardLines.length); j++) {
                                        if (standardLines[j].includes('2026') || standardLines[j].includes('Jul') || standardLines[j].includes('7月')) {
                                            checkin = standardLines[j]; break;
                                        }
                                    }
                                    orders.push({ platform: 'Agoda', id: id, name: name, checkin: checkin, inPms: false });
                                }
                            }
                        }

                        // 3. Ctrip
                        const ctripMatches = text.matchAll(/(1\d{14,15})\s*已接單/g);
                        for (const match of ctripMatches) {
                            let id = match[1];
                            if (!orders.some(o => o.id === id)) {
                                orders.push({ platform: 'Ctrip', id: id, name: 'Ctrip Guest', checkin: '2026年7月26日', inPms: false });
                            }
                        }

                        // 4. Expedia
                        const expMatches = text.matchAll(/(24\d{8})/g);
                        for (const match of expMatches) {
                            let id = match[1];
                            if (!isEzDateRef(id) && !orders.some(o => o.id === id)) {
                                orders.push({ platform: 'Expedia', id: id, name: 'Expedia Guest', checkin: '7月 26, 2026', inPms: false });
                            }
                        }

                        // 5. 易遊網 Eztravel
                        const eztMatches = text.matchAll(/(ORD\d+)/g);
                        for (const match of eztMatches) {
                            let id = match[1];
                            if (!text.includes(id + 'CXL') && !text.includes('CXL此間請取消') && !orders.some(o => o.id === id)) {
                                orders.push({ platform: 'Eztravel', id: id, name: 'Eztravel Guest', checkin: '20260726', inPms: false });
                            }
                        }

                        this.allParsedOrders = orders;
                        this.platformStats = new Set(orders.map(o => o.platform)).size;
                        
                        this.feedbackMsg = `成功解析出 ${orders.length} 筆有效 OTA 訂單！請接著在下方貼上 PMS 單號進行比對。`;
                        this.runReconciliation();
                    } catch (e) {
                        this.feedbackMsg = '解析過程中發生錯誤：' + e.message;
                        console.error(e);
                    }
                },
                runReconciliation() {
                    if (this.allParsedOrders.length === 0) {
                        return;
                    }

                    const pmsText = this.pmsInput;
                    if (!pmsText.trim()) {
                        return;
                    }

                    const rawPmsIds = pmsText.match(/\d{8,15}|ORD\d+/g) || [];
                    const pmsIds = new Set(rawPmsIds.filter(id => !isEzDateRef(id)));

                    this.matchedCount = 0;
                    
                    let updatedOrders = [];
                    this.allParsedOrders.forEach(order => {
                        let isMatch = pmsIds.has(order.id);
                        if (isMatch) this.matchedCount++;
                        updatedOrders.push({ ...order, inPms: isMatch });
                    });
                    
                    this.allParsedOrders = updatedOrders;
                    this.missingOrders = this.allParsedOrders.filter(o => !o.inPms);
                    
                    this.feedbackMsg = `✅ 比對完成！PMS 抓到 ${pmsIds.size} 筆獨立單號，成功對應 ${this.matchedCount} 筆，揪出 ${this.missingOrders.length} 筆漏單！`;
                },
                get filteredOrders() {
                    return this.allParsedOrders.filter(o => 
                        this.searchQuery === '' || 
                        o.id.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                        o.name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                        o.platform.toLowerCase().includes(this.searchQuery.toLowerCase())
                    );
                }
            }
        }
    </script>
</body>
</html>
